<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <!-- Neon Text & Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#9b51e0;#00f2fe" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#9b51e0;#00f2fe;#4facfe" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00f2fe;#4facfe;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="meshGlow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for dynamic neon bloom -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .rotate-orbit {
        transform-origin: 1040px 210px;
        animation: rotate 18s linear infinite;
      }
      .rotate-orbit-reverse {
        transform-origin: 1040px 210px;
        animation: rotateRev 24s linear infinite;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.96); }
        100% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" fill="url(#meshGlow1)" class="pulse-circle"/>
  <rect width="1200" height="420" rx="20" fill="url(#meshGlow2)" class="pulse-circle" style="animation-delay: -2s;"/>
  <rect width="1200" height="420" rx="20" fill="url(#meshGlow3)"/>

  <!-- Outer Border with Neon Accent -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="url(#glowBorder)" stroke-width="2" opacity="0.6"/>

  <!-- Tech Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="420" />
    <line x1="180" y1="0" x2="180" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="420" y1="0" x2="420" y2="420" />
    <line x1="540" y1="0" x2="540" y2="420" />
    <line x1="660" y1="0" x2="660" y2="420" />
    <line x1="780" y1="0" x2="780" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1020" y1="0" x2="1020" y2="420" />
    <line x1="1140" y1="0" x2="1140" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Interactive / Animated Circuit Tracing Network (Right Side) -->
  <g opacity="0.85">
    <!-- Center Node Core -->
    <circle cx="1040" cy="210" r="48" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="1040" cy="210" r="32" fill="#312e81" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="1040" cy="210" r="14" fill="#38bdf8">
      <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit 1 -->
    <circle cx="1040" cy="210" r="95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 6"/>
    <g class="rotate-orbit">
      <circle cx="1135" cy="210" r="7" fill="#00f2fe" filter="url(#softGlow)"/>
      <circle cx="945" cy="210" r="5" fill="#c084fc"/>
    </g>

    <!-- Orbit 2 -->
    <circle cx="1040" cy="210" r="145" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="10 8"/>
    <g class="rotate-orbit-reverse">
      <circle cx="1040" cy="65" r="8" fill="#ec4899" filter="url(#softGlow)"/>
      <circle cx="1040" cy="355" r="6" fill="#38bdf8"/>
      <circle cx="1185" cy="210" r="5" fill="#a855f7"/>
    </g>

    <!-- Connecting Trace Lines -->
    <path d="M 640 210 L 800 210 L 860 140 L 960 140" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow" opacity="0.6"/>
    <path d="M 670 280 L 780 280 L 850 280 L 940 280" fill="none" stroke="#a855f7" stroke-width="2" class="dash-flow" opacity="0.6"/>
    <path d="M 720 140 L 820 140 L 890 210 L 990 210" fill="none" stroke="#00f2fe" stroke-width="1.5" class="dash-flow" opacity="0.7"/>

    <circle cx="860" cy="140" r="4" fill="#38bdf8"/>
    <circle cx="850" cy="280" r="4" fill="#a855f7"/>
    <circle cx="800" cy="210" r="4" fill="#00f2fe"/>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
      <circle cx="18" cy="17" r="5" fill="#00ff9d" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-1" filter="url(#softGlow)">
        Awesome LLMOps
      </text>
      <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
        Platforms &amp; Frameworks
      </text>
    </g>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="254" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Production Tracing • Prompt Engineering • Evals • Observability • Agent Workflows
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 290)">
      <g transform="translate(0, 0)">
        <rect width="130" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔍 OTEL Tracing</text>
      </g>
      <g transform="translate(142, 0)">
        <rect width="135" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚖️ LLM-as-Judge</text>
      </g>
      <g transform="translate(289, 0)">
        <rect width="130" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📝 Prompt Ops</text>
      </g>
      <g transform="translate(431, 0)">
        <rect width="135" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Agent Ops</text>
      </g>
      <g transform="translate(578, 0)">
        <rect width="155" height="36" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
        <text x="14" y="23" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Open-Source &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>